[workspace]
resolver = "2"
default-members = ["crates/*"]
members = ["crates/*", "examples/counter", "examples/clock", "examples/gallery", "examples/chat", "examples/animation", "examples/canvas"]

[workspace.package]
version = "0.1.7"
edition = "2021"
rust-version = "1.93"
publish = ["crates-io"]
license = "MIT"
repository = "https://github.com/refractrs/refract"
homepage = "https://refract.rs"
readme = "README.md"

[workspace.dependencies]
refract-graph = { version = "0.1.7", path = "crates/graph" }
refract-core = { version = "0.1.7", path = "crates/core" }
refract-web = { version = "0.1.7", path = "crates/web" }
refract-native = { version = "0.1.7", path = "crates/native" }
refract-macros = { version = "0.1.7", path = "crates/macros" }
refract-test = { version = "0.1.7", path = "crates/test" }
refract = { version = "0.1.7", path = "crates/refract" }
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
web-sys = "=0.3.107"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"

# GPU dependencies produce large debug artifacts; keep local example builds lean.
[profile.dev]
debug = 0
incremental = false
