<!doctype html>
<meta charset="utf-8">
<title>Refract event capture check</title>
<style>body{font:16px system-ui;margin:32px;background:#f5f5f5;color:#18202b}#host{width:320px;padding:20px;background:white}pre{white-space:pre-wrap}#status{font-weight:600}</style>
<h1>Event capture check</h1>
<p>Click the blue target, or drag outside it. Capture should be acquired and released, without triggering press activation.</p>
<p id="status">Loading fixture…</p>
<div id="host"></div><pre id="events"></pre>
<script type="module">
import init, {start_events_fixture} from './pkg/refract_counter.js';
await init();
const host = document.querySelector('#host');
const fixture = start_events_fixture(host);
const log = document.querySelector('#events');
let captured = false, released = false, pressed = false;
for (const name of ['gotpointercapture','lostpointercapture']) {
  host.shadowRoot.addEventListener(name, event => {
    log.textContent += `${name}: ${event.target.getAttribute('aria-label')}\n`;
    if (name === 'gotpointercapture') captured = true;
    else released = true;
  });
}
document.querySelector('#status').textContent = 'Ready';
setInterval(() => {
  const events = fixture.take_events().split('|').filter(Boolean);
  for (const event of events) { log.textContent += event+'\n'; if (event === 'press') pressed = true; }
  if (captured && released) document.querySelector('#status').textContent = pressed
    ? 'FAIL: press was not suppressed'
    : 'PASS: native capture acquired and released; press suppressed';
}, 50);
window.addEventListener('pagehide', () => fixture.dispose(), {once:true});
</script>
