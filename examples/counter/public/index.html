<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f2f3eb">
  <meta name="description" content="A simple counter built with Refract, a reactive Rust UI framework for the browser and desktop.">
  <title>Counter — Refract</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f2f3eb}
    body{min-height:100svh;display:grid;place-items:center}
    #app{width:min(100%,536px);padding:36px 0}
    #loading{font:14px system-ui;color:#5a6656;text-align:center;padding:24px}
    @media(max-width:480px){#app{padding:12px 0}}
  </style>
</head>
<body>
  <main id="app" aria-label="Refract counter example"><p id="loading" role="status">Loading Refract…</p></main>
  <script type="module">
    import init, { start } from './pkg/refract_counter.js';
    try {
      await init();
      document.getElementById('loading').remove();
      window.counterApp = start(document.getElementById('app'));
    } catch (error) {
      console.error(error);
      const message = document.createElement('p');
      message.id = 'loading';
      message.textContent = 'Refract could not start. See the browser console for details.';
      document.getElementById('app').append(message);
    }
  </script>
</body>
</html>
