<!doctype html>
<meta charset="utf-8">
<title>Refract scroll checks</title>
<style>body{font:15px system-ui;padding:24px}li{margin:8px 0}#fixture{position:absolute;left:-1200px;width:300px;height:280px}</style>
<h1>Portable scroll checks</h1><p id="status">Running…</p><ol id="results"></ol><div id="fixture"></div>
<script type="module">
import init, {start_scroll_fixture} from './pkg/refract_chat.js';
const status = document.querySelector('#status'), results = document.querySelector('#results');
const delay = () => new Promise(resolve => setTimeout(resolve, 80));
function check(ok, message) {
  const li = document.createElement('li'); li.textContent = `${ok ? 'PASS' : 'FAIL'} — ${message}`; results.append(li);
  if (!ok) throw Error(message);
}
let app, host;
function mount(follow=false, end=false) {
  app?.dispose();
  host = document.createElement('div'); host.style.cssText = 'width:300px;height:280px';
  document.querySelector('#fixture').replaceChildren(host);
  app = start_scroll_fixture(host, follow, end);
}
const find = label => host.shadowRoot.querySelector(`[aria-label="${label}"]`);
const events = (target=0) => JSON.parse(app.events()).filter(e => e[0] === target);
const latest = () => events().at(-1);
const near = (a,b) => Math.abs(a-b) < 0.01;
try {
  await init(); mount(); await delay();
  let outer = find('Outer scroll'), inner = find('Inner scroll');
  check(events().length === 1 && latest()[3] === 0 && latest()[4] === 0, 'initial Rust snapshot has zero delta');
  check(latest()[5] === outer.clientWidth && latest()[6] === outer.clientHeight && latest()[7] === outer.scrollWidth && latest()[8] === outer.scrollHeight, 'Rust metrics match browser viewport and content geometry');
  const revision = app.revision();
  outer.scrollLeft = 12.5; outer.scrollTop = 30.25; outer.scrollTop = 60.5;
  await delay();
  check(events().length === 2 && near(latest()[1],outer.scrollLeft) && near(latest()[2],outer.scrollTop) && near(latest()[4],outer.scrollTop), 'multiple moves coalesce and retain the browser’s fractional offsets');
  check(app.revision() === revision, 'unchanged derived boolean avoids reactive reevaluation');
  const count = events().length, innerCount = events(1).length;
  inner.scrollTop = 40; await delay();
  check(events(1).length === innerCount+1 && events().length === count, 'nested scroll events target only the scroller that moved');
  outer.scrollTop = 100000; outer.scrollLeft = 100000; await delay();
  check(latest()[2] === outer.scrollHeight-outer.clientHeight && find('Scroll status').textContent === 'Latest', 'clamped movement reaches Rust and updates the reactive consumer');
  const endCount = events().length;
  outer.scrollTop = 100000; outer.dispatchEvent(new Event('scroll')); await delay();
  check(events().length === endCount, 'no duplicate event for input at a boundary');
  outer.scrollTop = 100; await delay();
  host.style.width = '350px'; await delay();
  check(latest()[5] === outer.clientWidth && latest()[5] === 350 && latest()[4] === 0, 'viewport resize emits geometry without fabricated vertical movement');
  const oldHeight = outer.scrollHeight;
  // Emulate late browser layout (e.g. an image/font) without a Rust patch.
  outer.firstElementChild.style.height = '1000px'; await delay();
  check(latest()[8] > oldHeight && latest()[4] === 0, 'ResizeObserver reports content growth outside Rust updates');
  app.resize_content(1100); await delay();
  check(latest()[8] === outer.scrollHeight && latest()[2] === 100, 'application content growth preserves an unpinned offset');
  app.remove_scroll(); await delay();
  const removedCount = events().length;
  outer.scrollTop = 0; outer.dispatchEvent(new Event('scroll')); await delay();
  check(!find('Outer scroll') && events().length === removedCount, 'removed scrollers stop delivering callbacks');
  mount(false, true); await delay(); outer = find('Outer scroll');
  check(outer.scrollTop === outer.scrollHeight-outer.clientHeight, 'initial end position works independently of following');
  const initialTop = outer.scrollTop;
  app.resize_content(1100); await delay();
  check(outer.scrollTop === initialTop, 'initial end applies once, not on subsequent growth');
  mount(true, true); await delay(); outer = find('Outer scroll');
  app.resize_content(1100); await delay();
  check(outer.scrollTop === outer.scrollHeight-outer.clientHeight, 'pinned viewport follows application growth');
  outer.firstElementChild.style.height = '1300px'; await delay();
  check(outer.scrollTop === outer.scrollHeight-outer.clientHeight, 'pinned viewport follows browser-only content growth');
  outer.scrollTop = 80; await delay();
  outer.firstElementChild.style.height = '1400px'; await delay();
  check(outer.scrollTop === 80, 'manual scrolling away suspends following');
  outer.scrollTop = 100000; await delay();
  outer.firstElementChild.style.height = '1500px'; await delay();
  check(outer.scrollTop === outer.scrollHeight-outer.clientHeight, 'returning to the end resumes following');
  check(!app.last_error(), 'no adapter errors');
  outer.scrollTop = 0; app.dispose(); await delay();
  check(!host.shadowRoot.querySelector('[data-refract-id]'), 'disposal cancels pending frame work and disconnects observers');
  status.textContent = `${results.children.length} checks passed`;
} catch(error) { console.error(error); status.textContent = `FAILED: ${error.message}`; }
finally { app?.dispose(); }
</script>
