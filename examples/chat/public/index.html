<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fbfcfe">
  <meta name="description" content="A quiet space to think. A composable Rust chat application, built with Refract.">
  <title>Chat</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#fbfcfe;color:#18283f}
    body{display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 18px;font:13px system-ui;border-bottom:1px solid #cbd5e3}
    #theme{font:inherit;color:inherit;background:transparent;border:1px solid #cbd5e3;border-radius:6px;padding:6px 10px;cursor:pointer}
    #theme:focus-visible{outline:2px solid #2857b7;outline-offset:3px}
    #app{width:100%;flex:1;min-height:0;min-width:360px}
    html[data-theme="dark"]{color-scheme:dark}
    html[data-theme="dark"] body{background:#101826;color:#e2ebf9}
    html[data-theme="dark"] header,html[data-theme="dark"] #theme{border-color:#384964}
  </style>
</head>
<body>
  <header><span>Refract chat · host inputs</span><button id="theme" type="button" aria-pressed="false" disabled>Dark mode</button></header>
  <main id="app" aria-label="Refract chat"><!--refract:app--></main>
  <noscript>Enable JavaScript to send messages and change the theme.</noscript>
  <script type="module">
    import init, { start } from './pkg/refract_chat.js';
    const preference = matchMedia('(prefers-color-scheme: dark)');
    const toggle = document.getElementById('theme');
    const host = document.getElementById('app');
    let dark = preference.matches;
    let manual = false;
    let app;
    const publish = () => {
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = dark ? '#101826' : '#fbfcfe';
      toggle.setAttribute('aria-pressed', String(dark));
      app?.set_dark(dark);
    };
    const followSystem = () => {
      if (!manual) { dark = preference.matches; publish(); }
    };
    toggle.addEventListener('click', () => {
      manual = true;
      dark = !dark;
      publish();
    });
    preference.addEventListener('change', followSystem);
    publish();
    try {
      await init();
      // Hydrate the shared light default, then publish the current host value.
      app = window.chatApp = start(host);
      host.dataset.refractHydrated = String(app.hydrated());
      publish();
      toggle.disabled = false;
    } catch (error) {
      app?.free();
      app = undefined;
      console.error(error);
      document.querySelector('header span').textContent = 'Chat could not start. See the browser console for details.';
    }
    addEventListener('pagehide', event => {
      if (event.persisted) return;
      preference.removeEventListener('change', followSystem);
      app?.free();
      app = undefined;
    });
  </script>
</body>
</html>
