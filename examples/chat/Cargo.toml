[package]
name = "refract-chat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
refract.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
refract-web.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
wasm-bindgen-futures = "=0.4.80"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
web-sys = { workspace = true, features = ["Element", "Window", "console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
refract-desktop = { workspace = true, optional = true }

[dev-dependencies]
refract-test.workspace = true

[features]
desktop = ["dep:refract-desktop"]

[[bin]]
name = "refract-chat-desktop"
path = "src/desktop.rs"
required-features = ["desktop"]
