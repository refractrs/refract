[package]
name = "refract-gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
refract.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
refract-web.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Element", "console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
refract-desktop = { workspace = true, optional = true }

[dev-dependencies]
refract-test.workspace = true

[features]
browser-tests = []
desktop = ["dep:refract-desktop"]

[[bin]]
name = "refract-gallery-desktop"
path = "src/desktop.rs"
required-features = ["desktop"]
