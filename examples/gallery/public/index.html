<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111315">
  <meta name="description" content="A small landscape photography gallery built with Refract, in Rust.">
  <title>Gallery — Refract</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#111315;color:#ededE4;color-scheme:dark}
    body{display:grid;place-items:center}
    #app{min-width:0;width:min(100%,1120px);height:100svh}
    #loading{font:14px system-ui;color:#939b97;text-align:center;padding:48px}
  </style>
</head>
<body>
  <main id="app" aria-label="Refract gallery"><p id="loading" role="status">Opening the collection…</p></main>
  <script type="module">
    import init, { start } from './pkg/refract_gallery.js';
    try {
      await init();
      document.getElementById('loading').remove();
      window.galleryApp = start(document.getElementById('app'));
    } catch (error) {
      console.error(error);
      document.getElementById('app').textContent = 'The gallery could not start. See the browser console for details.';
    }
  </script>
</body>
</html>
