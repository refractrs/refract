name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  native:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libfontconfig-dev fonts-dejavu-core \
            libxkbcommon-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxi-dev libxrandr-dev libxcursor-dev
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test workspace, CLI, and desktop features
        run: cargo test --workspace --all-features --locked
      - name: Check library without default features
        run: cargo check -p refract --no-default-features --locked
      - name: Check native adapter without the GPU renderer
        run: cargo check -p refract-native --no-default-features --locked

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Native test harnesses use threads and are not WebAssembly targets.
      - name: Build web adapter, apps, and browser fixtures
        run: >-
          cargo build --locked --target wasm32-unknown-unknown
          -p refract-web -p refract-counter -p refract-clock
          -p refract-gallery -p refract-chat -p refract-animation -p refract-canvas
          --features refract-counter/browser-tests,refract-gallery/browser-tests
          --lib --examples

      - name: Install browser test tools
        run: |
          cargo install wasm-bindgen-cli --version 0.2.130 --locked --root .tools
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run animation browser conformance
        run: |
          site_dir=$(mktemp -d)
          server_log=$(mktemp)
          server_pid=
          cleanup() {
            status=$?
            trap - EXIT
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            cat "$server_log"
            rm -rf "$site_dir" "$server_log"
            exit "$status"
          }
          trap cleanup EXIT

          cp -R examples/animation/public/. "$site_dir/"
          .tools/bin/wasm-bindgen \
            target/wasm32-unknown-unknown/debug/refract_animation.wasm \
            --target web --out-dir "$site_dir/pkg"
          python3 -m http.server 4176 --bind 127.0.0.1 \
            --directory "$site_dir" > "$server_log" 2>&1 &
          server_pid=$!
          ready=false
          for attempt in $(seq 1 45); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Animation server exited before becoming ready" >&2
              exit 1
            fi
            if curl --fail --silent --max-time 1 http://127.0.0.1:4176/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Timed out waiting for the animation server" >&2
            exit 1
          fi
          node .github/scripts/animation-smoke.mjs http://127.0.0.1:4176/
