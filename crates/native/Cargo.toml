[package]
name = "refract-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Native adapter for Refract with retained layout and GPU rendering"
documentation = "https://docs.rs/refract-native"
keywords = ["gui", "ui", "reactive", "web", "native"]
categories = ["gui"]
include = ["/src/**", "/tests/**", "/Cargo.toml", "/README.md", "/LICENSE*"]

[features]
default = ["vello"]
# Opt-in damage visualization; no overlay code or scheduling in normal builds.
debug-damage = ["vello"]
vello = ["dep:vello", "dep:pollster", "dep:objc2-quartz-core", "dep:objc2-app-kit"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
refract-core.workspace = true
winit = "0.30.13"
vello = { version = "0.11.0", optional = true }
parley = "0.12.0"
skrifa = "0.44.0"
arboard = { version = "3.6", default-features = false }
taffy = "0.15.1"
pollster = { version = "0.4", optional = true }
thiserror = "2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Keep platform presentation policy inside the default GPU renderer.
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer"], optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSView", "NSResponder"], optional = true }

[dev-dependencies]
refract.workspace = true
