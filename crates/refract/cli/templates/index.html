<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{name}}</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    import init, { start } from './pkg/{{crate}}.js';
    await init();
    window.refractApp = start(document.getElementById('app'));
    window.addEventListener('pagehide', () => window.refractApp.dispose());
  </script>
</body>
</html>
